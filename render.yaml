# Render Blueprint — deploys the Job Lead Tool as a web service + free Postgres DB.
# In Render: New + -> Blueprint -> pick your repo. It reads this file automatically.
services:
  - type: web
    name: job-lead-tool
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: SESSION_SECRET          # signs login sessions; random is fine
        generateValue: true
      - key: FERNET_KEY              # encrypts saved API keys; any random secret works
        generateValue: true
      - key: ANTHROPIC_API_KEY       # optional: enables resume auto-drafting
        sync: false
      - key: DATABASE_URL            # auto-filled from the database below
        fromDatabase:
          name: joblead-db
          property: connectionString

databases:
  - name: joblead-db
    plan: free
